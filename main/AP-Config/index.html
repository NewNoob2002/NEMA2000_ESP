<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>SingularXYZ Setup</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <main class="page" id="mainPage">
        <header class="header">
            <img id="pageLogo" src="singularxyz.png" alt="SingularXYZ">
            <div class="status">
                <span>Model: <b id="platformPrefix">Loading</b></span>
                <span>RTK Firmware: <b id="rtkFirmwareVersion">v0.0</b></span>
                <span id="gnssFirmwareVersion">GNSS Firmware: v0.0</span>
                <span id="deviceBTID">Device ID: 0000</span>
            </div>
        </header>

        <section class="panel">
            <button class="section-toggle" type="button" data-target="collapseProfileConfig">
                Profile Configuration <span class="caret">v</span>
            </button>
            <div class="section-body" id="collapseProfileConfig">
                <fieldset class="stack">
                    <legend>Active Profile</legend>
                    <label><input type="radio" name="profileRadio" value="0"> <span id="profile0Name">Profile 1</span></label>
                    <label><input type="radio" name="profileRadio" value="1"> <span id="profile1Name">Profile 2</span></label>
                    <label><input type="radio" name="profileRadio" value="2"> <span id="profile2Name">Profile 3</span></label>
                    <label><input type="radio" name="profileRadio" value="3"> <span id="profile3Name">Profile 4</span></label>
                    <label><input type="radio" name="profileRadio" value="4"> <span id="profile4Name">Profile 5</span></label>
                    <label><input type="radio" name="profileRadio" value="5"> <span id="profile5Name">Profile 6</span></label>
                    <label><input type="radio" name="profileRadio" value="6"> <span id="profile6Name">Profile 7</span></label>
                    <label><input type="radio" name="profileRadio" value="7"> <span id="profile7Name">Profile 8</span></label>
                </fieldset>

                <div class="field">
                    <label for="profileName">Profile Name</label>
                    <input type="text" id="profileName" maxlength="49">
                    <p id="profileNameError" class="inlineError"></p>
                    <p id="profileChangeMessage" class="inlineSuccess"></p>
                </div>

                <button type="button" id="btnResetProfile" class="primary" onclick="btnResetProfile()">Reset Profile</button>
                <p id="resetProfileMsg" class="inlineSuccess"></p>
            </div>
        </section>

        <section class="panel">
            <button class="section-toggle" type="button" data-target="collapseGNSSConfig">
                GNSS Configuration <span class="caret">v</span>
            </button>
            <div class="section-body" id="collapseGNSSConfig">
                <div class="grid">
                    <div class="field">
                        <label for="measurementRateHz">Measurement Rate (Hz)</label>
                        <input type="number" id="measurementRateHz" min="0.00012" max="10" step="0.01">
                        <p id="measurementRateHzError" class="inlineError"></p>
                    </div>
                    <div class="field">
                        <label for="measurementRateSec">Seconds Between Measurements</label>
                        <input type="number" id="measurementRateSec" min="0.1" max="8196" step="0.1">
                        <p id="measurementRateSecError" class="inlineError"></p>
                    </div>
                    <div class="field">
                        <label for="dynamicModel">Dynamic Model</label>
                        <select id="dynamicModel">
                            <option value="0">Portable</option>
                            <option value="1">Stationary</option>
                            <option value="2">Pedestrian</option>
                            <option value="3">Automotive</option>
                            <option value="4">Sea</option>
                            <option value="5">Airborne</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="minElev">Min SV Elevation</label>
                        <input type="number" id="minElev" min="0" max="90">
                        <p id="minElevError" class="inlineError"></p>
                    </div>
                    <div class="field">
                        <label for="minCN0">Min C/N0</label>
                        <input type="number" id="minCN0" min="0" max="90">
                        <p id="minCN0Error" class="inlineError"></p>
                    </div>
                    <div class="field">
                        <label for="rtcmMinElev">RTCM Min SV Elevation</label>
                        <input type="number" id="rtcmMinElev" min="-90" max="90">
                        <p id="rtcmMinElevError" class="inlineError"></p>
                    </div>
                </div>

                <fieldset class="check-grid">
                    <legend>Constellations</legend>
                    <label><input type="checkbox" id="constellation_GPS"> GPS</label>
                    <label><input type="checkbox" id="constellation_BeiDou"> BeiDou</label>
                    <label><input type="checkbox" id="constellation_Galileo"> Galileo</label>
                    <label><input type="checkbox" id="constellation_GLONASS"> GLONASS</label>
                    <label><input type="checkbox" id="constellation_QZSS"> QZSS</label>
                    <label><input type="checkbox" id="constellation_SBAS"> SBAS</label>
                    <label><input type="checkbox" id="constellation_NavIC"> NavIC</label>
                    <label><input type="checkbox" id="useMSM7"> Use MSM7 RTCM</label>
                    <p id="gnssConstellationsError" class="inlineError"></p>
                </fieldset>
            </div>
        </section>

        <section class="panel">
            <button class="section-toggle" type="button" data-target="collapseBaseConfig">
                Base Configuration <span class="caret">v</span>
            </button>
            <div class="section-body" id="collapseBaseConfig">
                <fieldset class="stack">
                    <legend>Base Mode</legend>
                    <label><input type="radio" id="baseTypeSurveyIn" name="baseType" value="0" checked> Survey-In</label>
                    <label><input type="radio" id="baseTypeFixed" name="baseType" value="1"> Fixed Position</label>
                </fieldset>

                <div id="surveyInConfig" class="subsection">
                    <div class="grid">
                        <div class="field">
                            <label for="observationSeconds">Observation Time (s)</label>
                            <input type="number" id="observationSeconds" min="60" max="600">
                            <p id="observationSecondsError" class="inlineError"></p>
                        </div>
                        <div class="field">
                            <label for="observationPositionAccuracy">Required Accuracy (m)</label>
                            <input type="number" id="observationPositionAccuracy" min="1" max="5" step="0.1">
                            <p id="observationPositionAccuracyError" class="inlineError"></p>
                        </div>
                    </div>
                </div>

                <div id="fixedConfig" class="subsection hidden">
                    <fieldset class="stack">
                        <legend>Fixed Coordinate Type</legend>
                        <label><input type="radio" id="fixedBaseCoordinateTypeECEF" name="positionType" value="0" checked> ECEF</label>
                        <label><input type="radio" id="fixedBaseCoordinateTypeGeo" name="positionType" value="1"> Geodetic</label>
                    </fieldset>

                    <div id="ecefConfig" class="grid">
                        <div class="field"><label for="fixedEcefX">ECEF X</label><input type="number" id="fixedEcefX"><p id="fixedEcefXError" class="inlineError"></p></div>
                        <div class="field"><label for="fixedEcefY">ECEF Y</label><input type="number" id="fixedEcefY"><p id="fixedEcefYError" class="inlineError"></p></div>
                        <div class="field"><label for="fixedEcefZ">ECEF Z</label><input type="number" id="fixedEcefZ"><p id="fixedEcefZError" class="inlineError"></p></div>
                    </div>

                    <div id="geodeticConfig" class="grid hidden">
                        <div class="field"><label for="fixedLatText">Latitude</label><input type="text" id="fixedLatText"><p id="fixedLatTextError" class="inlineError"></p></div>
                        <div class="field"><label for="fixedLongText">Longitude</label><input type="text" id="fixedLongText"><p id="fixedLongTextError" class="inlineError"></p></div>
                        <div class="field"><label for="fixedAltitude">HAE Mark / Alt (m)</label><input type="number" id="fixedAltitude"><p id="fixedAltitudeError" class="inlineError"></p></div>
                        <div class="field"><label for="fixedHAEAPC">HAE APC (m)</label><input type="number" id="fixedHAEAPC" disabled><p id="fixedHAEAPCError" class="inlineError"></p></div>
                    </div>
                </div>

                <div class="grid">
                    <div class="field">
                        <label for="antennaPhaseCenter">Antenna Phase Center (mm)</label>
                        <input type="number" id="antennaPhaseCenter" min="-200" max="200" step="0.1">
                        <p id="antennaPhaseCenterError" class="inlineError"></p>
                    </div>
                    <div class="field">
                        <label for="antennaHeightM">Antenna Height (m)</label>
                        <input type="number" id="antennaHeightM" min="-15" max="15" step="0.001">
                        <p id="antennaHeightMError" class="inlineError"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <button class="section-toggle" type="button" data-target="collapseSystemConfig">
                System Configuration <span class="caret">v</span>
            </button>
            <div class="section-body" id="collapseSystemConfig">
                <div class="field">
                    <label>System Firmware: <span id="rtkFirmwareVersionUpgrade">v0.0</span></label>
                    <label class="file-button">
                        <input type="file" name="binfile" id="submitFirmwareFile" onchange="firmwareUploadWait()">
                        Upload BIN
                    </label>
                    <progress id="firmwareUploadProgressBar" value="0" max="100"></progress>
                    <p id="firmwareUploadMsg" class="inlineSuccess"></p>
                </div>

                <div class="grid">
                    <div class="field">
                        <label for="lastState">System Initial State</label>
                        <select id="lastState">
                            <option value="0">Rover</option>
                            <option value="1">Base</option>
                            <option value="2">NTP</option>
                            <option value="3">BaseCast</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="measurementScale">Units</label>
                        <select id="measurementScale">
                            <option value="0">Meters</option>
                            <option value="1">Feet/Inches</option>
                        </select>
                    </div>
                </div>

                <label class="check-line"><input type="checkbox" id="enableBeeper"> Enable Audible Beeper</label>
                <label class="check-line"><input type="checkbox" id="enableFactoryDefaults"> Enable Factory Defaults</label>
                <button type="button" id="factoryDefaults" class="primary" onclick="resetToFactoryDefaults()" disabled>Reset to Factory Defaults</button>
                <p id="factoryDefaultsMsg" class="inlineSuccess"></p>
            </div>
        </section>

        <div class="actions">
            <button type="button" id="saveBtn" class="secondary" onclick="saveConfig()">Save Configuration</button>
            <button type="button" id="exitBtn" class="outline" onclick="exitConfig()">Exit and Reset</button>
        </div>
    </main>

    <section class="message hidden" id="resetInProcess"><b>Resetting</b><br>RTK device is rebooting. Please wait...</section>
    <section class="message hidden" id="resetComplete"><b>Reset Done</b><br>RTK device has now reset.</section>
    <section class="message hidden" id="firmwareUploadComplete"><b>Done</b><br>Firmware update complete. RTK device is now rebooting.</section>

    <script src="src/main.js"></script>
</body>

</html>
